<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health Console</title>
  <!-- Inline so no new file or server route is needed. A monochrome pulse
       line reads on both a light and a dark browser tab; img-src 'self'
       data: (see healthconsole/server.py's SECURITY_HEADERS) permits this
       exact form -- images only, nothing that can execute. -->
  <!-- xmlns's own URL is percent-encoded (%3A%2F%2F for "://") rather than
       literal: this project's test suite forbids any http(s):// reference
       in an authored file, and a namespace URI -- never fetched, just an
       XML identifier -- would otherwise trip that check by coincidence. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Cpath d='M2 17h6l3-9 5 18 4-13 2 4h8' fill='none' stroke='%23808080' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar border-bottom">
    <h1 id="app-title" class="h6 m-0"></h1>
    <div class="controls">
      <div class="btn-group" id="mode-group" role="tablist">
        <button type="button" class="btn btn-outline-secondary" id="mode-simple"
                role="tab" aria-selected="true" aria-controls="simple"></button>
        <button type="button" class="btn btn-outline-secondary" id="mode-expert"
                role="tab" aria-selected="false" aria-controls="expert"></button>
        <button type="button" class="btn btn-outline-secondary" id="mode-actions"
                role="tab" aria-selected="false" aria-controls="actions"></button>
      </div>
      <div class="btn-group" id="theme-group" role="group">
        <button type="button" class="btn btn-outline-secondary" id="theme-auto"></button>
        <button type="button" class="btn btn-outline-secondary" id="theme-light"></button>
        <button type="button" class="btn btn-outline-secondary" id="theme-dark"></button>
      </div>
      <label class="locale-field">
        <span id="locale-label" class="text-body-secondary small"></span>
        <select id="locale" class="form-select form-select-sm">
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>
    </div>
  </header>

  <p id="freshness" class="freshness alert alert-light m-0 rounded-0 border-0"
     aria-live="polite"></p>

  <main id="simple" class="view" role="tabpanel" aria-labelledby="mode-simple">
    <section class="verdict card text-center" aria-live="polite">
      <div class="card-body">
        <div class="gauge-holder"><canvas id="verdict-gauge" aria-hidden="true"></canvas></div>
        <p class="verdict-state h4 mb-2">
          <span id="verdict-icon" aria-hidden="true"></span>
          <span id="verdict-word"></span>
        </p>
        <p class="verdict-sentence text-body-secondary mb-3" id="verdict-sentence"></p>
        <p class="verdict-score m-0">
          <span id="score-label" class="text-body-secondary"></span>
          <strong id="score">—</strong><span aria-hidden="true">/100</span>
        </p>
      </div>
    </section>
    <div id="findings"></div>
  </main>

  <main id="expert" class="view view-wide" role="tabpanel"
        aria-labelledby="mode-expert" hidden>
    <div id="expert-tiles" class="row g-2 mb-3"></div>

    <div class="controls mb-3">
      <div class="btn-group" id="range-group" role="group"></div>
      <button type="button" class="btn btn-outline-secondary" id="refresh"></button>
    </div>

    <div id="chart-grid" class="row g-3"></div>

    <div class="accordion mt-3" id="expert-accordion">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
                  data-bs-toggle="collapse" data-bs-target="#probe-panel"
                  id="probes-heading" aria-expanded="false" aria-controls="probe-panel"></button>
        </h2>
        <div id="probe-panel" class="accordion-collapse collapse"
             data-bs-parent="#expert-accordion">
          <div class="accordion-body"><table id="probe-table" class="table table-sm m-0"></table></div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
                  data-bs-toggle="collapse" data-bs-target="#raw-panel"
                  id="raw-heading" aria-expanded="false" aria-controls="raw-panel"></button>
        </h2>
        <div id="raw-panel" class="accordion-collapse collapse"
             data-bs-parent="#expert-accordion">
          <div class="accordion-body"><pre id="raw" class="m-0 small"></pre></div>
        </div>
      </div>
    </div>
  </main>

  <main id="actions" class="view" role="tabpanel" aria-labelledby="mode-actions" hidden>
    <h2 id="actions-available-heading" class="h6"></h2>
    <div id="action-list" class="list-group mb-4"></div>

    <h2 id="actions-output-heading" class="h6"></h2>
    <pre id="action-output" class="border rounded p-2 mb-4 small"
         aria-live="polite"></pre>

    <h2 id="actions-audit-heading" class="h6"></h2>
    <div class="table-responsive">
      <table id="audit-table" class="table table-sm"></table>
    </div>
  </main>

  <div class="modal" id="action-confirm-modal" tabindex="-1"
       aria-labelledby="action-confirm-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="action-confirm-title"></h2>
        </div>
        <div class="modal-body">
          <p id="action-confirm-body" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary"
                  id="action-confirm-cancel" data-bs-dismiss="modal"></button>
          <button type="button" class="btn btn-primary"
                  id="action-confirm-go" data-bs-dismiss="modal"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
